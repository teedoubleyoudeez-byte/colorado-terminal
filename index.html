<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorado OS Console V8 // VOICE, SKULL & NEON</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --bg-color: #050505;
            --panel-bg: rgba(10, 10, 10, 0.85);
            --text-color: #e0e0e0;
            --accent-green: #39ff14; /* Upgraded to toxic neon green */
            --accent-blue: #0ff;
            --accent-amber: #ffaa00;
            --matrix-font: 'Share Tech Mono', 'Courier New', monospace;
        }

        body, html {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--matrix-font);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The CRT Screen Grime */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; 
            z-index: 9999;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.25)
            );
            background-size: 100% 4px;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Clipped corners and stacked neon shadows */
        #console-wrapper {
            position: relative;
            width: 90vw;
            height: 85vh;
            background: var(--panel-bg);
            border: 1px solid var(--accent-green);
            clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
            box-shadow: 
                inset 0 0 20px rgba(57, 255, 20, 0.2),
                0 0 40px rgba(57, 255, 20, 0.15);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 1;
            transition: opacity 1s ease;
        }

        #console-wrapper.dimmed { 
            opacity: 0.10; 
        }

        /* Glitch text header */
        #header {
            text-align: center;
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            padding: 15px;
            border-bottom: 1px solid rgba(57, 255, 20, 0.3);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 
                0 0 5px #fff,
                0 0 15px var(--accent-green),
                0 0 30px var(--accent-green);
            position: relative;
        }

        #header::before {
            content: attr(data-text);
            position: absolute;
            left: 0; width: 100%;
            text-shadow: 2px 0 red;
            top: 15px;
            color: white;
            background: transparent;
            overflow: hidden;
            animation: glitch-anim 3s infinite linear alternate-reverse;
            pointer-events: none;
        }

        @keyframes glitch-anim {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }

        #chat-box { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 20px; 
            font-size: 1.2em;
        }

        /* Custom Scrollbar for chat box */
        #chat-box::-webkit-scrollbar { width: 8px; }
        #chat-box::-webkit-scrollbar-track { background: transparent; border-left: 1px solid rgba(57,255,20,0.2); }
        #chat-box::-webkit-scrollbar-thumb { background: var(--accent-green); }

        .message { margin-bottom: 20px; line-height: 1.6; word-wrap: break-word; text-shadow: 0 0 5px rgba(255,255,255,0.2); }
        .sys-msg { color: var(--accent-amber); font-style: italic; }
        .user-msg { color: var(--accent-blue); text-shadow: 0 0 8px var(--accent-blue); }
        .ai-msg { color: var(--accent-green); white-space: pre-wrap; text-shadow: 0 0 8px var(--accent-green); }
        
        #input-area {
            display: flex;
            padding: 15px;
            background: rgba(5, 5, 5, 0.9);
            border-top: 1px solid rgba(57, 255, 20, 0.5);
            gap: 15px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            font-size: 1.2em;
            background: transparent;
            color: #fff;
            border: 1px solid #333;
            border-radius: 0;
            font-family: var(--matrix-font);
            text-shadow: 0 0 5px var(--accent-green);
            transition: border 0.3s;
        }

        input[type="text"]:focus { 
            outline: none; 
            border-color: var(--accent-green); 
            box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.2);
        }

        button {
            padding: 15px 25px;
            font-size: 1.2em;
            background: transparent;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-family: var(--matrix-font);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover { 
            background: var(--accent-green); 
            color: #000;
            box-shadow: 0 0 15px var(--accent-green);
        }
        
        button:active { transform: scale(0.98); }

        #mic-btn {
            border-color: var(--accent-blue);
            color: var(--accent-blue);
        }

        #mic-btn:hover {
            background: var(--accent-blue);
            color: #000;
            box-shadow: 0 0 15px var(--accent-blue);
        }

        #mic-btn.listening {
            background: #ff0055;
            color: white;
            border-color: #ff0055;
            box-shadow: 0 0 20px #ff0055;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- The CRT Scanline Overlay -->
    <div class="scanlines"></div>

    <!-- The Original Matrix Skull Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <div id="console-wrapper">
        <div id="header" data-text="COLORADO ONBOARD OS // terminal_v8">COLORADO ONBOARD OS // terminal_v8</div>
        <div id="chat-box">
            <div class="message sys-msg">[SYSTEM] Core online. Voice engine loaded. Giant skull protocol standing by.</div>
        </div>
        <div id="input-area">
            <input type="text" id="command-input" placeholder="Enter command or tap mic..." autocomplete="off">
            <button id="mic-btn" onclick="startVoice()">MIC</button>
            <button onclick="processCommand()">EXEC</button>
        </div>
    </div>

<script>
    // ==========================================
    // THE GRAPHICAL ENGINE (GIANT SKULL)
    // ==========================================
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const consoleWrapper = document.getElementById('console-wrapper');
    const chatBox = document.getElementById('chat-box');
    const inputField = document.getElementById('command-input');
    const micBtn = document.getElementById('mic-btn');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*+=?><{}[]'.split('');
    const fontSize = 16;
    let columns = Math.floor(width / fontSize);
    let drops = [];
    for(let i = 0; i < columns; i++) { drops[i] = { x: i * fontSize, y: Math.random() * height * -1, speed: 2 + Math.random() * 5 }; }

    let settledPoints = []; 
    // THE SKULL
    const skullMap = [
        "    $$$$$$$$    ",
        "  $$$$$$$$$$$$  ",
        " $$$$$$$$$$$$$$ ",
        " $$  $$$$$$  $$ ",
        " $$  $$$$$$  $$ ",
        " $$$$$$$$$$$$$$ ",
        "  $$$$$$$$$$$$  ",
        "    $$ $$ $$    ",
        "    $$ $$ $$    "
    ];
    const skullTargetPoints = [];
    const skullScale = 2.5; 
    const mapWidth = skullMap[0].length;
    const mapHeight = skullMap.length;
    const startX = (width - mapWidth * fontSize * skullScale) / 2;
    const startY = (height - mapHeight * fontSize * skullScale) / 2;

    for (let y = 0; y < mapHeight; y++) {
        for (let x = 0; x < mapWidth; x++) {
            if (skullMap[y][x] !== " ") {
                skullTargetPoints.push({ tx: startX + x * fontSize * skullScale, ty: startY + y * fontSize * skullScale, occupied: false });
            }
        }
    }

    let idleTimer;
    let systemIdle = false;
    function resetIdleTimer() {
        systemIdle = false;
        consoleWrapper.classList.remove('dimmed');
        settledPoints = []; 
        skullTargetPoints.forEach(p => p.occupied = false); 
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { systemIdle = true; consoleWrapper.classList.add('dimmed'); }, 15000); 
    }

    ['mousemove', 'touchstart', 'keypress'].forEach(e => window.addEventListener(e, resetIdleTimer));
    inputField.addEventListener('focus', resetIdleTimer);
    resetIdleTimer();

    function draw() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            let drop = drops[i];
            const char = characters[Math.floor(Math.random() * characters.length)];
            ctx.fillStyle = 'rgba(57, 255, 20, 0.8)';
            ctx.fillText(char, drop.x, drop.y);

            if (systemIdle) {
                for (let p = 0; p < skullTargetPoints.length; p++) {
                    let point = skullTargetPoints[p];
                    if (!point.occupied && Math.abs(drop.x - point.tx) < fontSize / 2 && Math.abs(drop.y - point.ty) < fontSize / 2) {
                        point.occupied = true;
                        settledPoints.push({ char: char, x: point.tx, y: point.ty, color: Math.random() > 0.95 ? '#ffaa00' : '#39ff14' });
                        drop.y = Math.random() * 100 * -1;
                    }
                }
            }
            drop.y += drop.speed;
            if (drop.y > height) drop.y = Math.random() * 100 * -1;
        }
        for (let s = 0; s < settledPoints.length; s++) {
            const p = settledPoints[s];
            ctx.fillStyle = p.color;
            ctx.fillText(p.char, p.x, p.y);
        }
    }
    setInterval(draw, 33); 
    window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

    // ==========================================
    // VOICE RECOGNITION ENGINE
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    function startVoice() {
        resetIdleTimer();
        if (!SpeechRecognition) {
            appendMessage('sys', '[Error] Voice API blocked or not supported by this browser.');
            return;
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        
        recognition.onstart = function() {
            micBtn.classList.add('listening');
            inputField.placeholder = "Awaiting verbal input...";
        };
        
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            inputField.value = transcript;
            processCommand();
        };
        
        recognition.onerror = function(event) {
            appendMessage('sys', `[Mic Error] ${event.error}`);
            micBtn.classList.remove('listening');
            inputField.placeholder = "Enter command or tap mic...";
        };
        
        recognition.onend = function() {
            micBtn.classList.remove('listening');
            inputField.placeholder = "Enter command or tap mic...";
        };
        
        recognition.start();
    }

    // ==========================================
    // THE DUMB TERMINAL SECURE API LOGIC
    // ==========================================
    // LEAVE YOUR GOOGLE SCRIPT URL EXACTLY AS IS
    const MASTER_PROXY_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; 

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-msg`;
        
        let prefix = '';
        if (role === 'user') prefix = 'travis@colorado:~# ';
        if (role === 'sys') prefix = '[SYS] ';
        if (role === 'ai') prefix = '[GROK] ';
        
        msgDiv.textContent = prefix + text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        resetIdleTimer(); 
    }

    inputField.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            processCommand();
        }
    });

    async function processCommand() {
        const rawInput = inputField.value.trim();
        if (!rawInput) return;
        
        appendMessage('user', rawInput);
        inputField.value = '';
        appendMessage('sys', 'Uplink established. Pinging Grok proxy...');

        try {
            const response = await fetch(MASTER_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    prompt: rawInput,
                    useWebSearch: rawInput.startsWith('?') // Triggers your Tavily integration
                })
            });

            const data = await response.json();
            
            if (data.error) {
                appendMessage('sys', `[Error] ${data.error}`);
            } else {
                appendMessage('ai', data.reply);
            }
            
        } catch (error) {
            appendMessage('sys', `[Fatal] Proxy Connection Lost. Grok is unreachable: ${error.message}`);
        }
    }
</script>
</body>
</html>
