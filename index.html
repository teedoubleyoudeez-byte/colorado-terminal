<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorado OS Console V7 // VOICE & SKULL</title>
    <style>
        :root {
            --bg-color: #000000;
            --panel-bg: rgba(10, 10, 10, 0.9);
            --text-color: #e0e0e0;
            --accent-green: #00ff33;
            --accent-blue: #00bfff;
            --accent-amber: #ffaa00;
            --matrix-font: 'Courier New', Courier, monospace;
        }
        body, html {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--matrix-font);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #console-wrapper {
            position: relative;
            width: 90vw;
            height: 85vh;
            background: var(--panel-bg);
            border: 2px solid #222;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 51, 0.2);
            z-index: 10;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 1;
            transition: opacity 1s ease;
        }
        #console-wrapper.dimmed { opacity: 0.15; }
        #header {
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: var(--accent-green);
            padding: 15px;
            border-bottom: 1px solid #333;
            text-shadow: 0 0 5px rgba(0, 255, 51, 0.5);
        }
        #chat-box { flex-grow: 1; overflow-y: auto; padding: 20px; }
        .message { margin-bottom: 20px; line-height: 1.6; word-wrap: break-word; }
        .sys-msg { color: var(--accent-amber); font-style: italic; }
        .user-msg { color: var(--accent-blue); }
        .ai-msg { color: var(--accent-green); white-space: pre-wrap; }
        #input-area {
            display: flex;
            padding: 15px;
            background: rgba(20, 20, 20, 0.9);
            border-top: 1px solid #333;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 15px;
            font-size: 1.1em;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            font-family: var(--matrix-font);
        }
        input[type="text"]:focus { outline: none; border-color: var(--accent-green); }
        button {
            padding: 15px 20px;
            font-size: 1.1em;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background: #00cc29; }
        #mic-btn {
            background: var(--accent-blue);
            font-size: 1.2em;
        }
        #mic-btn.listening {
            background: #ff0000; /* Turns red when active so you know it's hot */
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="console-wrapper">
        <div id="header">COLORADO ONBOARD OS // VEHICLE OBD VOICE & TEXT Ai</div>
        <div id="chat-box">
            <div class="message sys-msg">System online. Voice engine loaded, OBD connected, and telemetry active.</div>
        </div>
        <div id="input-area">
            <input type="text" id="command-input" placeholder="Enter command or tap mic..." autocomplete="off">
            <button id="mic-btn" onclick="startVoice()">🎙️</button>
            <button onclick="processCommand()">EXECUTE</button>
        </div>
    </div>

<script>
    // ==========================================
    // THE GRAPHICAL ENGINE (GIANT SKULL)
    // ==========================================
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const consoleWrapper = document.getElementById('console-wrapper');
    const chatBox = document.getElementById('chat-box');
    const inputField = document.getElementById('command-input');
    const micBtn = document.getElementById('mic-btn');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;
    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*+=?><{}[]'.split('');
    const fontSize = 16;
    let columns = Math.floor(width / fontSize);
    let drops = [];
    for(let i = 0; i < columns; i++) { drops[i] = { x: i * fontSize, y: Math.random() * height * -1, speed: 2 + Math.random() * 5 }; }

    let settledPoints = []; 
    // NEW MASSIVE BLOCKY SKULL MAP
    const skullMap = [
        "    $$$$$$$$    ",
        "  $$$$$$$$$$$$  ",
        " $$$$$$$$$$$$$$ ",
        " $$  $$$$$$  $$ ",
        " $$  $$$$$$  $$ ",
        " $$$$$$$$$$$$$$ ",
        "  $$$$$$$$$$$$  ",
        "    $$ $$ $$    ",
        "    $$ $$ $$    "
    ];
    const skullTargetPoints = [];
    const skullScale = 2.5; // CRANKED UP FOR HIGH VISIBILITY
    const mapWidth = skullMap[0].length;
    const mapHeight = skullMap.length;
    const startX = (width - mapWidth * fontSize * skullScale) / 2;
    const startY = (height - mapHeight * fontSize * skullScale) / 2;

    for (let y = 0; y < mapHeight; y++) {
        for (let x = 0; x < mapWidth; x++) {
            if (skullMap[y][x] !== " ") {
                skullTargetPoints.push({ tx: startX + x * fontSize * skullScale, ty: startY + y * fontSize * skullScale, occupied: false });
            }
        }
    }

    let idleTimer;
    let systemIdle = false;
    function resetIdleTimer() {
        systemIdle = false;
        consoleWrapper.classList.remove('dimmed');
        settledPoints = []; 
        skullTargetPoints.forEach(p => p.occupied = false); 
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => { systemIdle = true; consoleWrapper.classList.add('dimmed'); }, 15000); 
    }

    ['mousemove', 'touchstart', 'keypress'].forEach(e => window.addEventListener(e, resetIdleTimer));
    inputField.addEventListener('focus', resetIdleTimer);
    resetIdleTimer();

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            let drop = drops[i];
            const char = characters[Math.floor(Math.random() * characters.length)];
            ctx.fillStyle = 'rgba(0, 255, 51, 0.8)';
            ctx.fillText(char, drop.x, drop.y);

            if (systemIdle) {
                for (let p = 0; p < skullTargetPoints.length; p++) {
                    let point = skullTargetPoints[p];
                    if (!point.occupied && Math.abs(drop.x - point.tx) < fontSize / 2 && Math.abs(drop.y - point.ty) < fontSize / 2) {
                        point.occupied = true;
                        settledPoints.push({ char: char, x: point.tx, y: point.ty, color: Math.random() > 0.95 ? '#ffaa00' : '#00ff33' });
                        drop.y = Math.random() * 100 * -1;
                    }
                }
            }
            drop.y += drop.speed;
            if (drop.y > height) drop.y = Math.random() * 100 * -1;
        }
        for (let s = 0; s < settledPoints.length; s++) {
            const p = settledPoints[s];
            ctx.fillStyle = p.color;
            ctx.fillText(p.char, p.x, p.y);
        }
    }
    setInterval(draw, 33); 
    window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });

    // ==========================================
    // VOICE RECOGNITION ENGINE
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    function startVoice() {
        resetIdleTimer();
        if (!SpeechRecognition) {
            appendMessage('sys', '[Error] Voice API blocked or not supported by this browser.');
            return;
        }
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        
        recognition.onstart = function() {
            micBtn.classList.add('listening');
            inputField.placeholder = "Listening...";
        };
        
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            inputField.value = transcript;
            processCommand(); // Auto-fires when you finish speaking
        };
        
        recognition.onerror = function(event) {
            appendMessage('sys', `[Mic Error] ${event.error}`);
            micBtn.classList.remove('listening');
            inputField.placeholder = "Enter command or tap mic...";
        };
        
        recognition.onend = function() {
            micBtn.classList.remove('listening');
            inputField.placeholder = "Enter command or tap mic...";
        };
        
        recognition.start();
    }

    // ==========================================
    // THE DUMB TERMINAL SECURE API LOGIC
    // ==========================================
    // PASTE YOUR GOOGLE SCRIPT WEB APP URL HERE.
    const MASTER_PROXY_URL = "https://script.google.com/macros/s/AKfycbyU7UXEqAj3Cic2e-RtqBO5pYSux-tgQ-Dl-dAFr-BrhoIIMMldOJHjb62gnx1eYgSX/exec"; 

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-msg`;
        msgDiv.textContent = role === 'user' ? `> ${text}` : text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        resetIdleTimer(); 
    }

    inputField.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            processCommand();
        }
    });

    async function processCommand() {
        const rawInput = inputField.value.trim();
        if (!rawInput) return;
        
        appendMessage('user', rawInput);
        inputField.value = '';
        appendMessage('sys', '[Network] Pinging Secure Cloud Proxy...');

        try {
            const response = await fetch(MASTER_PROXY_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    prompt: rawInput,
                    useWebSearch: rawInput.startsWith('?')
                })
            });

            const data = await response.json();
            
            if (data.error) {
                appendMessage('sys', `[Error] ${data.error}`);
            } else {
                appendMessage('ai', data.reply);
            }
            
        } catch (error) {
            appendMessage('sys', `[Fatal] Proxy Connection Lost: ${error.message}`);
        }
    }
</script>
</body>
</html>
