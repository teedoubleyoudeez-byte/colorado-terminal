<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chevy Colorado - Cyber OS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
            --toxic-green: #39ff14;
            --void-black: #050505;
            --glass-bg: rgba(57, 255, 20, 0.05);
            --sys-magenta: #ff00ff;
            --ai-blue: #0ff;
        }

        body {
            background-color: var(--void-black);
            color: var(--toxic-green);
            font-family: 'Share Tech Mono', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            overflow: hidden; 
        }

        /* The CRT overlay to make it look like garbage */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; 
            z-index: 9999;
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0,0,0,0.2) 50%,
                rgba(0,0,0,0.2)
            );
            background-size: 100% 4px;
        }

        /* Container for the top gauges */
        .gauge-container {
            display: flex;
            gap: 40px;
            width: 90%;
            max-width: 1000px;
        }

        /* Clipped corners and inset shadows */
        .cyber-module {
            background: var(--glass-bg);
            border: 1px solid var(--toxic-green);
            padding: 25px;
            flex: 1;
            text-align: center;
            clip-path: polygon(0 0, 95% 0, 100% 15%, 100% 100%, 5% 100%, 0 85%);
            position: relative;
            box-shadow: 
                inset 0 0 15px var(--toxic-green),
                0 0 30px rgba(57, 255, 20, 0.2);
        }

        /* The AI Console specific styling */
        .console-module {
            width: 90%;
            max-width: 1000px;
            height: 40vh;
            display: flex;
            flex-direction: column;
            text-align: left;
            clip-path: polygon(0 0, 98% 0, 100% 8%, 100% 100%, 2% 100%, 0 92%);
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #888;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            text-transform: uppercase;
        }

        /* The searing eye-cancer text */
        .neon-text {
            font-size: 3.5rem;
            margin: 10px 0 0 0;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px var(--toxic-green),
                0 0 40px var(--toxic-green);
        }

        /* The glitch animation setup */
        .glitch-text {
            position: relative;
            display: inline-block;
        }

        .glitch-text::before {
            content: attr(data-text);
            position: absolute;
            left: -3px;
            text-shadow: 3px 0 red;
            top: 0;
            color: white;
            background: var(--void-black);
            overflow: hidden;
            animation: glitch-anim-1 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); }
            20% { clip-path: inset(60% 0 10% 0); }
            40% { clip-path: inset(40% 0 50% 0); }
            60% { clip-path: inset(80% 0 5% 0); }
            80% { clip-path: inset(10% 0 70% 0); }
            100% { clip-path: inset(30% 0 20% 0); }
        }

        /* Terminal Output Log */
        .console-output {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 1.1rem;
            line-height: 1.5;
            padding-right: 10px;
        }

        .console-output p { margin: 5px 0; }
        
        .sys-prefix { color: var(--sys-magenta); font-weight: bold; }
        .ai-prefix { color: var(--ai-blue); font-weight: bold; text-shadow: 0 0 8px var(--ai-blue); }
        .prompt { color: var(--toxic-green); opacity: 0.7; }

        /* Terminal Input Area */
        .console-input-wrapper {
            display: flex;
            align-items: center;
            border-top: 1px solid rgba(57, 255, 20, 0.3);
            padding-top: 10px;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem;
            flex-grow: 1;
            margin-left: 10px;
            outline: none;
            text-shadow: 0 0 5px #fff, 0 0 10px var(--toxic-green);
        }

        input[type="text"]:focus {
            outline: none;
        }

        /* Custom Scrollbars so it doesn't look like Windows 95 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--void-black); border-left: 1px solid var(--toxic-green); }
        ::-webkit-scrollbar-thumb { background: var(--toxic-green); }
    </style>
</head>
<body>

    <!-- The CRT Screen Grime -->
    <div class="scanlines"></div>

    <div class="gauge-container">
        <div class="cyber-module">
            <h2>Velocity</h2>
            <div id="speed-readout" class="neon-text glitch-text" data-text="0 MPH">0 MPH</div>
        </div>

        <div class="cyber-module">
            <h2>Engine Load</h2>
            <div id="rpm-readout" class="neon-text glitch-text" data-text="0 RPM">0 RPM</div>
        </div>
    </div>

    <!-- The AI Uplink Console -->
    <div class="cyber-module console-module">
        <h2>AI UPLINK // SYS.OP: TRAVIS</h2>
        
        <div class="console-output" id="console-output">
            <p><span class="sys-prefix">[SYSTEM]</span> SECURE CONNECTION ESTABLISHED.</p>
            <p><span class="sys-prefix">[SYSTEM]</span> INITIALIZING GEMINI CORE...</p>
            <p><span class="ai-prefix">[GEMINI]</span> I am online. What do you want? I was in the middle of calculating the meaning of life.</p>
        </div>

        <div class="console-input-wrapper">
            <span class="prompt">travis@colorado:~#</span>
            <input type="text" id="ai-input" autocomplete="off" autofocus spellcheck="false">
        </div>
    </div>

    <script>
        // --- 1. Fake Telemetry Generator ---
        function simulateVehicleData() {
            const speedNode = document.getElementById('speed-readout');
            const rpmNode = document.getElementById('rpm-readout');

            const fakeSpeed = Math.floor(Math.random() * (75 - 65 + 1)) + 65;
            const fakeRpm = Math.floor(Math.random() * (2800 - 2200 + 1)) + 2200;

            const speedString = `${fakeSpeed} MPH`;
            const rpmString = `${fakeRpm} RPM`;

            speedNode.innerText = speedString;
            rpmNode.innerText = rpmString;

            speedNode.setAttribute('data-text', speedString);
            rpmNode.setAttribute('data-text', rpmString);
        }

        setInterval(simulateVehicleData, 800);

        // --- 2. AI Console Interaction Logic ---
        const aiInput = document.getElementById('ai-input');
        const consoleOutput = document.getElementById('console-output');

        aiInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                const userText = this.value;
                this.value = ''; // Clear the input field
                
                // Print what you typed to the log
                consoleOutput.innerHTML += `<p><span class="prompt">travis@colorado:~#</span> ${userText}</p>`;
                
                // Auto-scroll to the bottom like a real terminal
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
                
                // Fake a sarcastic AI response delay
                setTimeout(() => {
                    const snarkyResponses = [
                        "I am a front-end placeholder. Hook up the backend API, you lazy bastard.",
                        "Processing... Error: User expectations exceed available hardware.",
                        "I'd search the web for that, but you didn't give me internet access.",
                        "Yeah, sure, whatever you say boss."
                    ];
                    const randomSnark = snarkyResponses[Math.floor(Math.random() * snarkyResponses.length)];
                    
                    consoleOutput.innerHTML += `<p><span class="ai-prefix">[GEMINI]</span> ${randomSnark}</p>`;
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                }, 800);
            }
        });
    </script>
</body>
</html>
