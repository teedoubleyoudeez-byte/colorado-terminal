<script>
    // ==========================================
    // API CONFIGURATION (GROQ MIGRATION)
    // ==========================================
    const GROQ_KEY = "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";
    const TAVILY_KEY = "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";
    const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbymH_5fj7eVuurl2DGtiWBzydBI0riIR8HUDOIX_FrMxeEY6VV5IJDukNtmSy9XOGy7/exec"; 

    // ==========================================
    // THE GRAPHICAL ENGINE (CODE SKULL)
    // ==========================================
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    const consoleWrapper = document.getElementById('console-wrapper');
    const chatBox = document.getElementById('chat-box');
    const inputField = document.getElementById('command-input');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*+=?><{}[]';
    const matrixChars = characters.split('');
    const fontSize = 16;
    const columns = Math.floor(width / fontSize);

    let drops = [];
    for(let i = 0; i < columns; i++) {
        drops[i] = { x: i * fontSize, y: Math.random() * height * -1, speed: 2 + Math.random() * 5 };
    }

    let settledPoints = []; 

    const skullMap = [
        "      <$$$$$$$>      ",
        "    <$$$$$$$$$$$>    ",
        "   <$$$$$ ? $$$$$>   ",
        "  <$$$$$     $$$$$>  ",
        "  $$$$$$$   $$$$$$$  ",
        "  $$$$$$$   $$$$$$$  ",
        "  $$$$$$$$ $$$$$$$$  ",
        "   <$$$$$ + $$$$$>   ",
        "    $$$$$$ $$$$$$    ",
        "     $$$ $$$ $$$     ",
        "      $$$$ $$$$      ",
        "       $$$$$$$       "
    ];

    const skullTargetPoints = [];
    const skullScale = 1.6; 
    const mapWidth = skullMap[0].length;
    const mapHeight = skullMap.length;
    const startX = (width - mapWidth * fontSize * skullScale) / 2;
    const startY = (height - mapHeight * fontSize * skullScale) / 2;

    for (let y = 0; y < mapHeight; y++) {
        for (let x = 0; x < mapWidth; x++) {
            if (skullMap[y][x] !== " ") {
                skullTargetPoints.push({
                    tx: startX + x * fontSize * skullScale,
                    ty: startY + y * fontSize * skullScale,
                    occupied: false
                });
            }
        }
    }

    let idleTimer;
    let systemIdle = false;

    function resetIdleTimer() {
        systemIdle = false;
        consoleWrapper.classList.remove('dimmed');
        settledPoints = []; 
        skullTargetPoints.forEach(p => p.occupied = false); 
        clearTimeout(idleTimer);
        
        idleTimer = setTimeout(() => {
            systemIdle = true;
            consoleWrapper.classList.add('dimmed');
        }, 20000); 
    }

    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('touchstart', resetIdleTimer);
    window.addEventListener('keypress', resetIdleTimer);
    inputField.addEventListener('focus', resetIdleTimer);
    resetIdleTimer();

    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, width, height);
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            let drop = drops[i];
            const char = matrixChars[Math.floor(Math.random() * matrixChars.length)];

            ctx.fillStyle = 'rgba(0, 255, 51, 0.8)';
            ctx.fillText(char, drop.x, drop.y);

            if (systemIdle) {
                for (let p = 0; p < skullTargetPoints.length; p++) {
                    let point = skullTargetPoints[p];
                    if (!point.occupied && Math.abs(drop.x - point.tx) < fontSize / 2 && Math.abs(drop.y - point.ty) < fontSize / 2) {
                        point.occupied = true;
                        settledPoints.push({
                            char: char,
                            x: point.tx,
                            y: point.ty,
                            color: Math.random() > 0.95 ? '#ffaa00' : '#00ff33' 
                        });
                        drop.y = Math.random() * 100 * -1;
                    }
                }
            }

            drop.y += drop.speed;
            if (drop.y > height) {
                drop.y = Math.random() * 100 * -1;
            }
        }

        for (let s = 0; s < settledPoints.length; s++) {
            const p = settledPoints[s];
            ctx.fillStyle = p.color;
            ctx.fillText(p.char, p.x, p.y);
        }
    }

    setInterval(draw, 33); 

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    // ==========================================
    // THE AI LOGIC & TELEMETRY INTEGRATION
    // ==========================================
    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${role}-msg`;
        msgDiv.textContent = role === 'user' ? `> ${text}` : text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        resetIdleTimer(); 
    }

    inputField.addEventListener("keypress", (event) => {
        if (event.key === "Enter") {
            event.preventDefault();
            processCommand();
        }
    });

    async function processCommand() {
        const rawInput = inputField.value.trim();
        if (!rawInput) return;
        
        appendMessage('user', rawInput);
        inputField.value = '';
        
        let finalPrompt = rawInput;
        let useWebSearch = rawInput.startsWith('?');
        
        if (useWebSearch) {
            const searchQuery = rawInput.substring(1).trim();
            appendMessage('sys', '[Network] Querying Tavily live web data...');
            
            try {
                const tavilyRes = await fetch('https://api.tavily.com/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        api_key: TAVILY_KEY,
                        query: searchQuery,
                        search_depth: "basic",
                        include_answer: false
                    })
                });
                
                if (!tavilyRes.ok) throw new Error("Tavily API failed");
                
                const tavilyData = await tavilyRes.json();
                const webContext = tavilyData.results.map(r => r.content).join('\n');
                finalPrompt = `Based on the following live web search results:\n\n${webContext}\n\nAnswer this prompt: ${searchQuery}`;
                
            } catch (error) {
                appendMessage('sys', `[Error] Tavily Search Failed: ${error.message}`);
                return;
            }
        }

        appendMessage('sys', '[Network] Pinging OBD2 Telemetry Bridge...');
        let truckContext = "Telemetry offline or engine is off.";
        try {
            const telRes = await fetch(`${TELEMETRY_URL}?action=pull`);
            if (telRes.ok) {
                const telData = await telRes.json();
                if (telData.status !== "offline") {
                    truckContext = JSON.stringify(telData); 
                }
            }
        } catch (e) {
            appendMessage('sys', '[Warning] Telemetry Bridge unreachable.');
        }

        appendMessage('sys', '[System] Processing via Groq LPU Network (Llama 3)...');

        const systemInstruction = `You are the AI onboard computer for a 2017 Chevy Colorado. Keep answers concise, direct, and formatted for an IT Lead. You have access to the vehicle's live OBD2 data. The current raw Torque Pro PID parameters are: ${truckContext}. (Note: k5 is Coolant Temp in Celsius, kc is Engine RPM, kd is Speed in km/h. Convert to Fahrenheit and MPH in your responses).`;
        
        // GROQ API ENDPOINT AND PAYLOAD
        const groqUrl = `https://api.groq.com/openai/v1/chat/completions`;
        
        const groqBody = {
            model: "llama-3.1-8b-instant",
            messages: [
                { role: "system", content: systemInstruction },
                { role: "user", content: finalPrompt }
            ]
        };

        try {
            const groqRes = await fetch(groqUrl, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${GROQ_KEY}`
                },
                body: JSON.stringify(groqBody)
            });

            // DIAGNOSTIC ERROR HANDLER
            if (!groqRes.ok) {
                let errorMsg = `HTTP ${groqRes.status}`;
                try {
                    const errData = await groqRes.json();
                    errorMsg += ` - ${errData.error.message}`;
                } catch (e) {
                    errorMsg += ` - Unknown Server Rejection`;
                }
                throw new Error(errorMsg);
            }

            // EXTRACT Llama 3 RESPONSE
            const groqData = await groqRes.json();
            const aiText = groqData.choices[0].message.content;
            
            appendMessage('ai', aiText);
            
        } catch (error) {
            appendMessage('sys', `[Error] Core Engine Offline: ${error.message}`);
        }
    }
</script>
